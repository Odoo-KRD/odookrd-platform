name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # prisma generate resolves the datasource URL at generate time via
      # prisma.config.ts, so it must be set even though nothing connects here.
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Prisma client is generated into apps/api/src/generated/prisma and is
      # gitignored, so every typecheck and test run has to create it first.
      - name: Generate Prisma client
        run: pnpm --filter api prisma:generate

      - name: Validate Prisma schema
        run: pnpm --filter api prisma:validate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test
