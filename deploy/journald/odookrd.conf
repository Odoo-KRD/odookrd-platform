# journald limits for OdooKRD.
#
# Install with:
#   sudo mkdir -p /etc/systemd/journald.conf.d
#   sudo cp deploy/journald/odookrd.conf /etc/systemd/journald.conf.d/
#   sudo systemctl restart systemd-journald
#
# Structured logging writes a JSON line per request rather than occasional
# prose, so volume is considerably higher than before. journald's default is to
# use up to 10% of the filesystem, which on a large disk is a lot of logs and
# on a small one is enough to matter. Disk exhaustion takes down Postgres and
# both services at once, so this is worth bounding explicitly rather than
# relying on a percentage.

[Journal]
# Hard ceiling across all units. Roughly a month of request logs at this
# application's volume; raise it if journalctl starts losing useful history.
SystemMaxUse=500M

# Leave headroom so a log spike cannot fill the disk.
SystemKeepFree=1G

# Discard anything older than this regardless of size. Errors worth keeping
# longer are in Sentry; these are the detailed lines behind them.
MaxRetentionSec=30day

# Cap any single file so rotation happens steadily rather than in large jumps.
SystemMaxFileSize=50M

# Keep logs across reboots: an outage investigation usually starts after a
# restart, and volatile storage would have discarded exactly what is needed.
Storage=persistent
